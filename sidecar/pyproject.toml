[project]
name = "sidecar"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "langchain-core>=1.6.1",
    "langgraph>=1.2.11",
    "numpy>=2.5.2",
    "onnxruntime>=1.29.0",
    "pyobjc-framework-coremedia>=12.2.2",
    "pyobjc-framework-screencapturekit>=12.2.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "silero-vad>=6.2.1",
    "sounddevice>=0.5.6",
    "sqlite-vec>=0.1.9",
    "uvicorn>=0.52.4",
    "websockets>=16.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
